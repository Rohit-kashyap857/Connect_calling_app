name: connect_call_assignment
description: Assignment-focused Flutter 1-to-1 calling app.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.5.0
  firebase_core: ^3.15.1
  firebase_auth: ^5.6.2
  cloud_firestore: ^5.6.12
  cloud_functions: ^5.6.2
  firebase_messaging: ^15.2.10
  flutter_riverpod: ^2.6.1
  flutter_webrtc: ^0.12.12
  flutter_callkit_incoming: ^2.5.4
  flutter_local_notifications: ^19.4.0
  google_sign_in: ^6.3.0
  go_router: ^16.2.0
  cached_network_image: ^3.4.1
  intl: ^0.19.0
  uuid: ^4.5.1
  shared_preferences: ^2.5.5
  google_fonts: ^8.2.1
  image_picker: ^1.2.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/discord_incoming_call.mp3
    - assets/images/app_icon.png
    - assets/screenshot/
